<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Periodic Table</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg:#0f1117;
  --cell-border:#262a38;
  --text:#e6e8ef;
  --muted:#9aa1b4;

  --alkali:#ff6b6b;
  --alkaline:#ffb15c;
  --lanthanide:#ff9de2;
  --actinide:#ff7fbf;
  --transition:#f4c95d;
  --post-transition:#8fd3a5;
  --metalloid:#c9d86b;
  --nonmetal:#5fd0f3;
  --halogen:#4da3ff;
  --noble:#8f8fff;
  --unknown:#7a8299;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  padding:28px 16px 60px;
}
h1{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:1.7rem;
  margin:0 0 4px;
  text-align:center;
}
.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:.85rem;
  margin-bottom:22px;
}

.table-wrap{
  max-width:1500px;
  margin:0 auto;
  overflow-x:auto;
  padding-bottom:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(18, minmax(56px,1fr));
  grid-auto-rows:56px;
  gap:3px;
  min-width:1080px;
}

.cell{
  border-radius:6px;
  border:1px solid var(--cell-border);
  padding:3px 5px;
  position:relative;
  cursor:default;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:transform .12s ease, box-shadow .12s ease;
  background:#171a23;
}
.cell:hover{
  transform:scale(1.12);
  z-index:5;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}
.cell .num{
  font-size:.55rem;
  color:rgba(15,17,23,.65);
  font-weight:600;
}
.cell .sym{
  font-family:'Syne',sans-serif;
  font-size:1rem;
  font-weight:800;
  color:#0f1117;
  line-height:1;
}
.cell .name{
  font-size:.42rem;
  color:rgba(15,17,23,.75);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.spacer{visibility:hidden;}

/* Legend */
.legend{
  max-width:1500px;
  margin:22px auto 0;
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
  justify-content:center;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:.72rem;
  color:var(--muted);
}
.swatch{
  width:14px;height:14px;border-radius:4px;
  border:1px solid var(--cell-border);
}

/* category color classes */
.alkali-metal{background:var(--alkali);}
.alkaline-earth{background:var(--alkaline);}
.lanthanide{background:var(--lanthanide);}
.actinide{background:var(--actinide);}
.transition-metal{background:var(--transition);}
.post-transition{background:var(--post-transition);}
.metalloid{background:var(--metalloid);}
.nonmetal{background:var(--nonmetal);}
.halogen{background:var(--halogen);}
.noble-gas{background:var(--noble);}
.unknown{background:var(--unknown);}

.f-block-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Detail panel */
.panel{
  max-width:1500px;
  margin:0 auto 20px;
  background:#171a23;
  border:1px solid var(--cell-border);
  border-radius:12px;
  padding:16px 22px;
  display:flex;
  align-items:center;
  gap:22px;
  min-height:64px;
  flex-wrap:wrap;
}
.panel.empty{color:var(--muted);font-size:.85rem;justify-content:center;}
.panel-symbol{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:2.2rem;
  min-width:66px;
  text-align:center;
  border-radius:10px;
  padding:6px 10px;
  color:#0f1117;
}
.panel-main{display:flex;flex-direction:column;gap:2px;min-width:150px;}
.panel-name{font-family:'Syne',sans-serif;font-weight:700;font-size:1.15rem;}
.panel-cat{font-size:.72rem;color:var(--muted);text-transform:capitalize;}
.panel-stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px 22px;
  flex:1;
}
.stat{display:flex;flex-direction:column;gap:1px;}
.stat .k{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.stat .v{font-size:.95rem;font-weight:600;}
.stat .v.blue{color:#4da3ff;}
.stat .v.orange{color:#ff9d4d;}
.stat .v.green{color:#4ddd8f;}
.stat .v.purple{color:#b98dff;}
</style>
</head>

const catLabel = {

  "transition metal":"Transition Metal",

  "metalloid":"Metalloid",
  "nonmetal":"Nonmetal",
  "halogen":"Halogen",
  "noble gas":"Noble Gas",
  "unknown":"Unknown / Predicted"

const grid = document.getElementById('grid');
const panel = document.getElementById('panel');

function showPanel(el){
  const [num,sym,name,group,period,cat,mass,en] = el;
  const protons = num;
  const electrons = num;
  const neutrons = Math.round(mass) - num;
  const swatchClass = categoryColor[cat];

  panel.classList.remove('empty');
  panel.innerHTML = `
    <div class="panel-symbol ${swatchClass}">${sym}</div>
    <div class="panel-main">
      <div class="panel-name">${name}</div>
      <div class="panel-cat">${catLabel[cat]} · Z=${num}</div>
    </div>
    <div class="panel-stats">
      <div class="stat"><span class="k">Atomic Mass</span><span class="v blue">${mass} u</span></div>
      <div class="stat"><span class="k">Protons</span><span class="v orange">${protons}</span></div>
      <div class="stat"><span class="k">Electrons</span><span class="v orange">${electrons}</span></div>
      <div class="stat"><span class="k">Neutrons</span><span class="v orange">${neutrons >= 0 ? neutrons : '—'}</span></div>
      <div class="stat"><span class="k">Electronegativity</span><span class="v green">${en !== null ? en.toFixed(2) : '—'}</span></div>
      <div class="stat"><span class="k">Group / Period</span><span class="v purple">${group} / ${period <= 7 ? period : (period===9?6:7)}</span></div>
    </div>
  `;
}

function resetPanel(){
  panel.classList.add('empty');
  panel.innerHTML = 'Hover an element to see its atomic mass, protons, neutrons, electrons &amp; electronegativity';
}

elements.forEach((elData)=>{
  const [num,sym,name,group,period,cat] = elData;
  const div = document.createElement('div');
  div.className = 'cell ' + categoryColor[cat];
  div.style.gridColumn = group;
  div.style.gridRow = period;
  div.innerHTML = `<span class="num">${num}</span><span class="sym">${sym}</span><span class="name">${name}</span>`;
  div.addEventListener('mouseenter', ()=>showPanel(elData));
  div.addEventListener('mouseleave', resetPanel);
  div.addEventListener('focus', ()=>showPanel(elData));
  div.addEventListener('blur', resetPanel);
  div.tabIndex = 0;
  grid.appendChild(div);
});
